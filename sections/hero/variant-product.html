<!--
  Hero — product variant.

  Used for: an individual product landing page (offbeat-fm.com, getwrite.io, future products).

  This example uses OffBeat-FM. To adapt:

    OffBeat-FM   wordmark = OffBeat<span class="text-brand-red font-mono font-normal text-[0.52em] ml-[3px] tracking-[0.04em] align-middle">FM</span>
                 descriptor = INDEPENDENT MUSIC DISCOVERY — offbeat-fm.com
    GetWrite     wordmark = <span class="text-fg-tertiary font-normal tracking-[-0.02em]">Get</span>Write
                 descriptor = LOCAL-FIRST WRITING STUDIO — getwrite.io
    New product  Follow the same pattern: a single condensed wordmark with at most one
                 intra-word weight/color shift. See brand/inputs/saboteur-brand-system-v06.html
                 for the rules on product marks.

  Product variant differences vs parent variant:
    - No Japanese tier in the mark.
    - Wordmark sized one step smaller: clamp(36px, 9vw, 72px).
    - Descriptor uses the PRODUCT's own domain (not sub-brand) — that's what
      distinguishes a product-site hero from a parent-page product card.
    - Product pages typically include one primary CTA below the body.

  Tokens used: bg-brand-black, border-brand-red, border-brand-rule, border-brand-dim,
               text-fg-primary, text-fg-secondary, text-fg-tertiary, text-brand-red,
               font-display, font-sans, font-mono, tracking-wordmark.
-->
<section class="bg-brand-black border-b border-brand-rule px-6 pt-[72px] pb-[64px]">

  <div class="inline-flex flex-col gap-[5px] border-l-[4px] border-brand-red pl-5 mb-10">
    <span class="font-display font-bold text-fg-primary tracking-wordmark leading-none text-[clamp(36px,9vw,72px)]">
      OffBeat<span class="text-brand-red font-mono font-normal text-[0.52em] ml-[3px] tracking-[0.04em] align-middle">FM</span>
    </span>
    <span class="font-mono text-fg-tertiary tracking-[0.18em] text-[10px] border-t-[0.5px] border-brand-dim pt-2 mt-1">
      INDEPENDENT MUSIC DISCOVERY — offbeat-fm.com
    </span>
  </div>

  <p class="font-sans font-light text-fg-secondary text-[clamp(15px,3.5vw,18px)] leading-[1.7] tracking-[0.01em] max-w-3xl mb-8">
    Radio you found, not radio you were given.
    <em class="not-italic text-fg-primary">No algorithms. No editorial committees. No paid placement disguised as taste.</em>
    Just music, the way you remember finding it.
  </p>

  <!-- Primary CTA — product pages typically have one. Outlined mono button style. -->
  <a href="#get-early-access"
     class="inline-block font-mono text-[10px] tracking-[0.14em] text-fg-primary hover:text-fg-tertiary uppercase border border-brand-dim hover:border-brand-mid px-[14px] py-2 transition-colors duration-150">
    Request early access →
  </a>

</section>
