<!--
  Nav — minimal variant (default for Saboteur landing pages).

  Anatomy:
    - 52px tall, sticky, hairline bottom rule.
    - Left: reduced mark (wordmark + small Japanese, both inline-baseline).
            Both mark tiers use fg-primary — the mark is treated as a single
            identity unit, not a hierarchy of emphasis levels.
    - Right: 2-4 mono uppercase links in fg-tertiary, with fg-primary on hover.

  Slots to fill:
    - Mark text. Replace with the site's reduced mark per brand/identity.md.
      Parent:    SABOTEUR    / サボタージ員
      Labs:      SAB/labs    / 研究所
      Works:     SAB/works   / 製作所
      Product:   <product wordmark> / <product Japanese, if defined>
    - Link href + label. 2-4 items. Mono uppercase, short.

  Two kinds of link live here and they behave differently:

    - Section anchors (#mission, #contact) work only on the landing page,
      because that is the only page containing those sections.
    - Site routes (/blog, /changelog) work on every page.

  On a standalone page — /privacy, /terms, a post, 404 — the ANCHORS are
  omitted and the routes stay. Do not ship a section link on a page whose
  anchor doesn't exist: it looks like a control and does nothing. Do not drop
  the route links there either: they are the only way out of that page besides
  the mark.

  In Astro this is a `showSections` prop on Nav, defaulting to true and passed
  false by Legal.astro and Post.astro. It gates the anchor <li>s only — the
  route <li>s sit outside the conditional. A site with no content surfaces has
  no route links, so showSections={false} leaves just the mark, as before.

  Four links maximum, anchors and routes counted together.

  Tokens used: bg-brand-black, border-brand-rule, border-brand-red,
               text-fg-primary, text-fg-tertiary,
               font-display, font-sans, font-mono.
-->
<nav class="sticky top-0 z-10 bg-brand-black border-b border-brand-rule flex items-center h-[52px] px-6">

  <a href="/" class="flex items-baseline border-l-[3px] border-brand-red pl-3" aria-label="Home">
    <span class="font-display font-bold text-fg-primary text-[17px] tracking-[-0.03em] leading-none">
      SABOTEUR
    </span>
    <span class="font-sans font-bold text-fg-primary text-[10px] tracking-[0.1em] ml-2 leading-none">
      サボタージ員
    </span>
  </a>

  <ul class="ml-auto flex items-center gap-5">

    <!-- ANCHORS — landing page only. In Astro, wrap these in {showSections && ( … )}. -->
    <li>
      <a href="#mission" class="font-mono text-[10px] tracking-[0.14em] text-fg-tertiary hover:text-fg-primary uppercase transition-colors duration-150">
        Mission
      </a>
    </li>
    <li>
      <a href="#products" class="font-mono text-[10px] tracking-[0.14em] text-fg-tertiary hover:text-fg-primary uppercase transition-colors duration-150">
        Products
      </a>
    </li>

    <!-- ROUTES — every page, never inside the showSections conditional.
         Include only the surfaces the site actually has; omit both entirely on
         a site with no /blog and no /changelog. -->
    <li>
      <a href="/blog" class="font-mono text-[10px] tracking-[0.14em] text-fg-tertiary hover:text-fg-primary uppercase transition-colors duration-150">
        Blog
      </a>
    </li>

    <!-- ANCHOR again — the trailing contact link stays with the anchors. -->
    <li>
      <a href="#contact" class="font-mono text-[10px] tracking-[0.14em] text-fg-tertiary hover:text-fg-primary uppercase transition-colors duration-150">
        Get in touch
      </a>
    </li>
  </ul>

</nav>
