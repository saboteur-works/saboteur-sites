<!--
  Hero — parent / sub-brand variant.

  Used for: saboteur.dev (Saboteur LLC) or a SAB/labs / SAB/works site.

  Slots to fill:
    - Wordmark text:  SABOTEUR  |  SAB/labs  |  SAB/works
    - Japanese:       サボタージ員  |  研究所  |  製作所
    - Descriptor:     CREATOR-FIRST SOFTWARE — saboteur.dev
                      developer tools & knowledge — saboteur-labs.dev
                      creator & consumer products — saboteur-works.dev
    - Body:           one paragraph with three clauses (positive opener,
                      italicized stance in brand-white, positive closer).

  Sizing — match these exactly:
    wordmark   clamp(48px, 12vw, 88px) display 700 tracking -0.04em
    Japanese   clamp(15px, 4vw,  28px) sans 700, tracking 0.16em
    descriptor 10px mono mid tracking 0.18em with hairline top rule
    body       clamp(15px, 3.5vw, 18px) sans 300 LIGHT, leading 1.7, tracking 0.01em

  Tokens used: bg-brand-black, border-brand-red, border-brand-rule, border-brand-dim,
               text-fg-primary, text-fg-secondary, text-fg-tertiary,
               font-display, font-sans, font-mono, tracking-wordmark.
-->
<section class="bg-brand-black border-b border-brand-rule px-6 pt-[72px] pb-[64px]">

  <!-- Mark — three tiers with red structural bar -->
  <div class="inline-flex flex-col gap-[5px] border-l-[4px] border-brand-red pl-5 mb-10">
    <span class="font-display font-bold text-fg-primary tracking-wordmark leading-none text-[clamp(48px,12vw,88px)]">
      SABOTEUR
    </span>
    <span class="font-sans font-bold text-fg-primary tracking-[0.16em] leading-none text-[clamp(15px,4vw,28px)]">
      サボタージ員
    </span>
    <span class="font-mono text-fg-tertiary tracking-[0.18em] text-[10px] border-t-[0.5px] border-brand-dim pt-2 mt-1">
      CREATOR-FIRST SOFTWARE — saboteur.dev
    </span>
  </div>

  <!-- Body — one paragraph, three clauses. Stance is in brand-white via <em>. -->
  <p class="font-sans font-light text-fg-secondary text-[clamp(15px,3.5vw,18px)] leading-[1.7] tracking-[0.01em] max-w-3xl">
    We build tools for people who make things.
    <em class="not-italic text-fg-primary">No lock-in. No committees. No feature designed by a growth team.</em>
    Just software that respects the work.
  </p>

</section>
